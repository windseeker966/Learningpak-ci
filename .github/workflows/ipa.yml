name: IPA

# 编译 iPad 真机版本（Debug，和本地 Xcode 装到 iPad 上的一样），不签名，打包成 Learning-unsigned.ipa 上传为构建产物。
# 免费 Apple ID 的描述文件只能在 Mac 上由 Xcode 申请、7 天到期，所以签名和安装放在 Mac 上做：
# 私有仓库的 `PackFormat/resign.sh ci` 下载最新的产物，用 xcodebuild -exportArchive 签名，备份后装到 iPad。
# 产物里的 SOURCE_REV 是这份代码对应的私有仓库提交号（由 tools/sync-public.sh 写入）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || { ls -d /Applications/Xcode*; exit 1; }
          xcodebuild -version

      - name: 缓存 Swift 包
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Learning.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 编译真机版本（Debug，不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Learning.xcodeproj \
            -scheme Learning \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E '(error|warning):|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' xcodebuild.log

      - name: 打包 IPA
        run: |
          APP=build/Build/Products/Debug-iphoneos/Learning.app
          [ -d "$APP" ] || { echo "找不到 $APP"; ls build/Build/Products; exit 1; }
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry Learning-unsigned.ipa Payload && rm -rf Payload)
          cp SOURCE_REV out/ 2>/dev/null || echo unknown > out/SOURCE_REV
          echo "私有仓库提交：$(cat out/SOURCE_REV)"
          ls -lh out

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Learning-ipa
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
