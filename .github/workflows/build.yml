name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 和本地 Mac 用同一版 Xcode（新版编译器的并发检查、类型检查更严，本地能编的这里可能报错）
      - name: 选择 Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || { ls -d /Applications/Xcode*; exit 1; }
          xcodebuild -version

      - name: 缓存 Swift 包
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Learning.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 编译（模拟器，不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Learning.xcodeproj \
            -scheme Learning \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E '(error|warning):|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' xcodebuild.log

      - name: 测试（Tests/ 下每个文件用 swiftc 单独编译运行）
        run: |
          failed=0
          for f in Tests/*.swift; do
            echo "::group::$f"
            if eval "$(grep -m1 '^// swiftc' "$f" | sed 's#^// ##') -module-cache-path /tmp/learning-swift-module-cache" && \
               "$(grep -m1 '^// /tmp/' "$f" | sed 's#^// ##')"; then
              echo "通过"
            else
              echo "::error file=$f::测试失败"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
